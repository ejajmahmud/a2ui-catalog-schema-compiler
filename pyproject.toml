[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2ui-catalog-schema-compiler"
version = "0.1.0"
description = "Declarative A2UI generative UI payload validator, primitive catalog registry, and safe fallback renderer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
a2ui-catalog-schema-compiler = "a2ui_catalog_schema_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["a2ui_catalog_schema_compiler*"]
